# 只配置 FileHandler（ConsoleHandler 由代码手动添加，避免 System.err 红色）
handlers=java.util.logging.FileHandler
java.util.logging.ConsoleHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# 标准格式（但只能输出类名，无方法名和行号）
java.util.logging.SimpleFormatter.format=%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS | %4$s | %2$s | %5$s%6$s%n

# 文件 Handler 详细配置
java.util.logging.FileHandler.level=INFO
java.util.logging.FileHandler.formatter=org.miea04.core.logs.StyleFormatter
java.util.logging.FileHandler.pattern=%h/myapp.log
java.util.logging.FileHandler.limit=1048576          # 单个文件 1MB
java.util.logging.FileHandler.count=5                # 轮转文件数
java.util.logging.FileHandler.append=true            # 追加模式
java.util.logging.FileHandler.encoding=UTF-8

# 根日志级别
.level=INFO